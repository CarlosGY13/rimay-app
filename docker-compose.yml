# docker-compose para desarrollo local de Rimay.
# Levanta la app (Next.js) junto a una instancia de Postgres.
# Los valores sensibles se leen del archivo .env (ver .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expuesto a localhost solo para inspección con un cliente de DB en dev.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rimay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Token de operador inyectado en el bundle en tiempo de build (Tarea 6).
        NEXT_PUBLIC_OPERATOR_TOKEN: ${NEXT_PUBLIC_OPERATOR_TOKEN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Dentro de la red de Docker el host de la DB es el nombre del servicio
      # ("postgres"), no localhost. Se arma desde los componentes del .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Proveedor de IA (Tarea 4). Se leen del .env del host.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Token de operador para validar las rutas sensibles en runtime (Tarea 6).
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rimay

volumes:
  postgres_data:

networks:
  rimay:
    driver: bridge
