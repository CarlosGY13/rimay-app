# Stack de DESARROLLO con recarga en caliente (hot reload).
#
# Uso:
#   docker compose -f docker-compose.dev.yml up
#
# Corre `next dev` dentro de un contenedor con el código montado como volumen,
# así los cambios se reflejan al instante sin rebuildear. Comparte el mismo
# volumen de datos (postgres_data) que el stack de producción.
#
# NO lo corras al mismo tiempo que `docker compose up` (ambos usan el 3000/5432).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rimay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: node:18-bookworm-slim
    working_dir: /app
    # Instala deps (en el volumen del contenedor), aplica migraciones pendientes
    # y arranca Next en modo dev escuchando en todas las interfaces.
    command: sh -lc "npm install && npx prisma generate && npx prisma migrate deploy && npx next dev -H 0.0.0.0 -p 3000"
    # next dev escucha stdin (atajos de teclado del modo dev). Sin TTY, bajo
    # `docker compose up` recibe EOF y se cierra solo ("exited with code 0").
    # Con stdin_open + tty se mantiene corriendo.
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: development
      # Dentro de la red de Docker la DB es el servicio "postgres".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Telegram (integración por webhook).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Necesario para que el file-watching funcione sobre el bind mount.
      WATCHPACK_POLLING: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Código fuente montado: los cambios se reflejan en caliente.
      - .:/app
      # node_modules y .next viven en el contenedor (no se mezclan con el host).
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rimay

  # Poller de Telegram (solo desarrollo). Consulta Telegram con getUpdates y
  # reenvía cada mensaje al webhook de la app. Evita necesitar un túnel público:
  # no hay URL que exponer ni webhook que registrar. Si no hay token/secret en
  # el .env, el poller queda inactivo (no molesta).
  telegram-poller:
    image: node:18-bookworm-slim
    working_dir: /app
    command: sh -lc "node scripts/telegram-poller.mjs"
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Endpoint interno de la app dentro de la red de Docker.
      APP_WEBHOOK_URL: http://app:3000/api/telegram/webhook
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - app
    networks:
      - rimay

volumes:
  postgres_data:

networks:
  rimay:
    driver: bridge
